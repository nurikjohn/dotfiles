# Included from ~/.config/ghostty/config, which stays under Omarchy's control
# (omarchy font set rewrites its font-family line with sed -i, which would
# destroy a stow symlink). Values here are applied after it, so they win.

font-size = 11

window-padding-x = 0
window-padding-y = 0

custom-shader-animation = always
link-url = true
quick-terminal-animation-duration = 0
