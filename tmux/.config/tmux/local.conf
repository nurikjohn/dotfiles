# Sourced from the end of ~/.config/tmux/tmux.conf, so these win over it.
# Only deltas live here -- mouse, base-index, vi mode-keys, allow-passthrough
# and extended-keys are already set there.
#
# Every colour below is a named ANSI colour, which tmux resolves through the
# terminal palette. That means the bar tracks the active Omarchy theme; no hex
# values are hardcoded.

# Prefix: Home instead of C-Space, and drop the C-b secondary.
unbind C-b
unbind C-Space
set -g prefix Home
set -gu prefix2
bind-key Home send-prefix

# Copy straight to the Wayland clipboard.
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'

bind -n C-k clear-history

# Open a pane running the assistant, or focus it if one already exists.
bind-key a run-shell "~/.local/bin/assistant-toggle"
bind-key A run-shell "~/.local/bin/assistant-toggle --select"

# Let applications set the cursor shape.
set -as terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# Status bar
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100
set -g status-style "bg=default,fg=default"

# Session name; turns red while the prefix is held.
set -g status-left "#{?client_prefix,#[fg=black#,bg=red],#[fg=black#,bg=green]}  #S "
set -g status-right "#[fg=black,bg=yellow]  #{b:pane_current_path} #[fg=black,bg=magenta]  %Y-%m-%d %H:%M "

# Omarchy renames windows to the cwd basename; unset so tmux falls back to its
# default, which names them after the running command.
setw -gu automatic-rename-format

setw -g window-status-separator ""
setw -g window-status-style "fg=default,bg=default,none"
setw -g window-status-activity-style "fg=default,bg=default,none"
setw -g window-status-format "#[fg=brightblack] #I #W "
setw -g window-status-current-format "#[fg=default,bold] #I #W "

set -g message-style "fg=default,bg=default,align=centre"
set -g message-command-style "fg=default,bg=default,align=centre"

set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"

setw -g clock-mode-colour blue
setw -g mode-style "fg=black,bg=yellow,bold"
